name: flutter_watchkit
description: Generic Flutter <-> Apple Watch connectivity framework built on WatchConnectivity (WCSession).
publish_to: "none"
version: 1.0.0

environment:
    sdk: ^3.10.8
    flutter: ">=3.3.0"

dependencies:
    flutter:
        sdk: flutter
    meta: ^1.3.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    plugin:
        platforms:
            ios:
                pluginClass: FlutterWatchKitPlugin
